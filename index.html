<!doctype html>
<!-- 基づく仕様書：GroupSplitter 仕様書 v1.1 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GroupSplitter">
<title>GroupSplitter</title>
<script src="js/theme.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button id="update-btn" type="button" hidden>新しい版があります。押すと更新します</button>

<main>
  <!-- ［名簿］タブ -->
  <section id="panel-roster" class="tab-panel">
    <div class="roster-head">
      <h1>GroupSplitter</h1>
      <div class="roster-tools">
        <span id="roster-status" class="status"></span>
        <button id="roster-refresh-btn" type="button" class="btn small">↻ 更新</button>
      </div>
    </div>
    <p id="roster-notes" class="notes"></p>
    <p id="clear-note" class="clear-note" hidden>チェックをすべて外しました <button id="clear-undo-btn" type="button" class="btn small">元に戻す</button></p>
    <div id="roster-groups"></div>
    <div class="spacer-roster"></div>
  </section>

  <!-- ［結果］タブ -->
  <section id="panel-result" class="tab-panel" hidden>
    <div id="result-empty" class="empty-card">
      <p>まだ振り分けていません。［名簿］タブでチェックを付けて［振り分ける］を押してください</p>
      <button id="goto-roster-btn" type="button" class="btn">名簿へ</button>
    </div>
    <div id="result-toolbar" class="toolbar" hidden>
      <button id="undo-btn" type="button" class="btn">元に戻す</button>
      <button id="reshuffle-btn" type="button" class="btn">振り分け直す</button>
    </div>
    <div id="select-hint" class="select-hint" hidden><span></span> <button id="cancel-select-btn" type="button" class="btn small">選択をやめる</button></div>
    <p id="result-note" class="result-note" hidden></p>
    <div id="car-list" class="car-list" hidden></div>
    <div id="unplaced-card" class="car-card unplaced" hidden></div>
    <div class="spacer-other"></div>
  </section>

  <!-- ［設定］タブ -->
  <section id="panel-settings" class="tab-panel" hidden>
    <div class="settings">
      <h1>設定</h1>
      <label class="field">名簿のスプレッドシートのURL
        <input id="set-sheet-url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <p id="sheet-id-label" class="hint"></p>
      <label class="field">GASのURL（…/exec で終わるもの）
        <input id="set-gas-url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label class="field">合言葉（GASで作ったもの）
        <input id="set-pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <h2 class="sub">名簿の読み方</h2>
      <label class="field">読み込む列（例：F,I,L,O　列の数が変わったら、ここを直す。空欄＝自動で探す）
        <input id="set-columns" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <label class="field">メンバーの先頭の行（最初のメンバーがいる行の番号。初期値7。空欄＝自動で探す）
        <input id="set-member-row" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label class="field">メンバーの最後の行（空欄＝表の最後まで）
        <input id="set-end-row" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label class="field">見出しの行（グループ名が書かれている行の番号。空欄＝自動）
        <input id="set-heading-row" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <div class="toolbar">
        <button id="set-save-btn" type="button" class="btn primary">保存する</button>
        <button id="test-btn" type="button" class="btn">読み込みテスト</button>
      </div>
      <p id="set-msg" class="msg"></p>
      <h2 class="sub">見た目</h2>
      <div id="theme-group" class="seg" role="group" aria-label="見た目">
        <button type="button" class="theme-btn" data-theme-mode="auto">自動</button>
        <button type="button" class="theme-btn" data-theme-mode="light">ノーマル</button>
        <button type="button" class="theme-btn" data-theme-mode="dark">ダーク</button>
      </div>
      <p class="hint">「自動」は、この端末の外観の設定（ダークかどうか）に合わせます。選ぶとすぐ変わります。この端末だけの設定です。</p>
      <div class="toolbar">
        <button id="clear-cache-btn" type="button" class="btn danger">名簿の写しを消す</button>
      </div>
      <p id="app-version" class="hint"></p>
    </div>
    <div class="spacer-other"></div>
  </section>
</main>

<!-- 画面下に固定の操作バー（［名簿］タブだけ） -->
<div id="action-bar">
  <p id="action-error" class="action-error" role="alert"></p>
  <p id="action-warn" class="action-warn"></p>
  <p id="action-summary" class="action-summary"></p>
  <div class="action-buttons">
    <button id="clear-checks-btn" type="button" class="btn">チェックをすべて外す</button>
    <button id="assign-btn" type="button" class="btn primary big">振り分ける</button>
  </div>
</div>

<nav id="tab-bar" aria-label="画面の切り替え">
  <button type="button" class="tab-btn" data-tab="roster">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zM4 11h16v2H4zM4 17h10v2H4z"/></svg><span>名簿</span>
  </button>
  <button type="button" class="tab-btn" data-tab="result">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11h1v6h-2v1.5a1.5 1.5 0 0 1-3 0V17H9v1.5a1.5 1.5 0 0 1-3 0V17H4v-6zm2.3 0h9.4l-1-3H8.3zM7 13.2a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4zm10 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/></svg><span>結果</span>
  </button>
  <button type="button" class="tab-btn" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.5 4.5v-2l-2.1-.5a6.6 6.6 0 0 0-.7-1.7l1.1-1.9-1.4-1.4-1.9 1.1a6.6 6.6 0 0 0-1.7-.7L13 3.5h-2l-.5 2.1a6.6 6.6 0 0 0-1.7.7L6.9 5.2 5.5 6.6l1.1 1.9c-.3.5-.5 1.1-.7 1.7L3.8 11v2l2.1.5c.2.6.4 1.2.7 1.7l-1.1 1.9 1.4 1.4 1.9-1.1c.5.3 1.1.5 1.7.7l.5 2.1h2l.5-2.1c.6-.2 1.2-.4 1.7-.7l1.9 1.1 1.4-1.4-1.1-1.9c.3-.5.5-1.1.7-1.7z"/></svg><span>設定</span>
  </button>
</nav>

<script src="js/store.js"></script>
<script src="js/assign.js"></script>
<script src="js/roster.js"></script>
<script src="js/ui-roster.js"></script>
<script src="js/ui-result.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
